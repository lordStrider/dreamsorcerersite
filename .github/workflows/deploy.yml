name: Deploy via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: 🚚 Enviar via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: "172.67.204.46"
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          # ADICIONE ESTA LINHA ABAIXO:
          protocol: ftp
