<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Login JWT</title>
    <style>
        body { font-family: sans-serif; display: flex; gap: 50px; padding: 50px; }
        form { display: flex; flex-direction: column; gap: 10px; border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        input { padding: 8px; }
        button { cursor: pointer; padding: 10px; background: #28a745; color: white; border: none; }
        .area-privada { margin-top: 20px; display: none; border-top: 2px solid #000; padding-top: 20px; }
    </style>
</head>
<body>

    <form id="formRegistro">
        <h3>Criar Conta</h3>
        <input type="text" id="regUsuario" placeholder="Usuário" required>
        <input type="email" id="regEmail" placeholder="E-mail" required>
        <input type="password" id="regSenha" placeholder="Senha" required>
        <button type="submit">Registrar</button>
    </form>

    <form id="formLogin">
        <h3>Login</h3>
        <input type="text" id="loginUsuario" placeholder="Usuário" required>
        <input type="password" id="loginSenha" placeholder="Senha" required>
        <button type="submit">Entrar</button>
        <p id="msgErro" style="color:red;"></p>
    </form>

    <div id="areaDashboard" class="area-privada">
        <h2>Bem-vindo ao Painel!</h2>
        <p>Você está autenticado com um JWT.</p>
        <button onclick="acessarDadosProtegidos()">Testar Acesso Protegido</button>
        <button onclick="logout()" style="background: #dc3545;">Sair</button>
        <pre id="resultadoApi"></pre>
    </div>

    <script>
        const API_URL = ""; // Se os arquivos estiverem na mesma pasta, deixe vazio

        // --- FUNÇÃO DE REGISTRO ---
        document.getElementById('formRegistro').onsubmit = async (e) => {
            e.preventDefault();
            const dados = {
                usuario: document.getElementById('regUsuario').value,
                email: document.getElementById('regEmail').value,
                senha: document.getElementById('regSenha').value
            };

            const resp = await fetch('registrar.php', {
                method: 'POST',
                body: JSON.stringify(dados)
            });
            const res = await resp.json();
            alert(res.mensagem || res.erro);
        };

        // --- FUNÇÃO DE LOGIN ---
        document.getElementById('formLogin').onsubmit = async (e) => {
            e.preventDefault();
            const dados = {
                usuario: document.getElementById('loginUsuario').value,
                senha: document.getElementById('loginSenha').value
            };

            const resp = await fetch('login.php', {
                method: 'POST',
                body: JSON.stringify(dados)
            });

            const res = await resp.json();

            if (res.token) {
                // SALVA O JWT NO NAVEGADOR
                localStorage.setItem('meu_jwt', res.token);
                mostrarPainel();
            } else {
                document.getElementById('msgErro').innerText = res.erro || "Falha no login";
            }
        };

        // --- ACESSAR ROTA PROTEGIDA ---
        async function acessarDadosProtegidos() {
            const token = localStorage.getItem('meu_jwt');

            const resp = await fetch('dashboard.php', {
                method: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + token // ENVIA O TOKEN NO HEADER
                }
            });

            const res = await resp.json();
            document.getElementById('resultadoApi').innerText = JSON.stringify(res, null, 2);
        }

        function mostrarPainel() {
            document.getElementById('areaDashboard').style.display = 'block';
            document.getElementById('formLogin').style.display = 'none';
        }

        function logout() {
            localStorage.removeItem('meu_jwt');
            location.reload();
        }

        // Verifica se já está logado ao carregar a página
        if (localStorage.getItem('meu_jwt')) {
            mostrarPainel();
        }
    </script>
</body>
</html>
